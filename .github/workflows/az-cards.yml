########################################################################
# 🏷️🖼️ تصميمُ تجميعة ماركات أمازون — WP-962 (D-259 · 2026-11-05)
#
# قراره: «ابي تصميم بطاقة مصممة فيها الأسعار والخصم» ثمّ على «تبيها تنزل كذا تلقائي مع التجميعة كل يوم؟» «نعم اعتمد».
# النظامُ يحسم القائمة قبل 18:30 بنصف ساعة وينادي هذا المصنعَ فورًا (lib/nidaa.js · az_cards) ⇐ يرسم الصفحات
# (قالب «ماركات رياضية» الفاتح · 4:5) ويودعها ببصمة القائمة. لا ينشر شيئًا.
# المواعيدُ الثابتة احتياطُ النداء: 18:06 و18:16 رياضًا (15:06 · 15:16 UTC) · وبالدفع حين يتغيّر المصنع · ويدويًّا.
# 🛒 WP-966: ويرسم معها تجميعةَ بقالة أمازون (قالب ag1 الأخضر · الحسم 14:30 · النشر 15:00) — نفسُ المصنع ونفسُ النداء az_cards.
# 🏷️ WP-967: وماركاتِ علي إكسبريس (قالب ae1 الأحمر · الحسم 10:00 · النشر 10:30) — نفسُ المصنع ونفسُ النداء.
# 📺 WP-969: ودليلَ شراء علي إكسبريس (قالب ae1 بعنوان الدليل · الحسم 23:00 · النشر 23:30) — نفسُ المصنع ونفسُ النداء.
# 🔑 TT_BOT_KEY — نفسُ سرِّ مصانع البطاقات، ويرى أبوابَه المسمّاة فقط (azbrands/card/todo · upload).
########################################################################
name: تصميم ماركات أمازون

on:
  schedule:
    - cron: "6 7 * * *"     # 🏷️ WP-967: ماركات علي إكسبريس 10:06 و10:16 رياضًا (الحسم 10:00)
    - cron: "16 7 * * *"
    - cron: "6 20 * * *"    # 📺 WP-969: دليل شراء علي إكسبريس 23:06 و23:16 رياضًا (الحسم 23:00)
    - cron: "16 20 * * *"
    - cron: "36 11 * * *"   # 🛒 WP-966: بقالة أمازون 14:36 و14:46 رياضًا (الحسم 14:30)
    - cron: "46 11 * * *"
    - cron: "6 15 * * *"
    - cron: "16 15 * * *"
  push:
    branches: [security/wp-204-clean]
    paths:
      - ".github/workflows/az-cards.yml"
      - "tools/codecard/azcard.py"
      - "tools/codecard/azrun.py"
  workflow_dispatch:
    inputs:
      dry:
        description: "تشغيلٌ جافّ (يرسم ولا يودع)"
        type: boolean
        default: false

concurrency:
  group: az-cards
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: تجهيز
        run: |
          pip install --quiet "Pillow>=10" playwright
          python3 -m playwright install --with-deps chromium >/dev/null
      - name: رسمٌ وإيداع
        env:
          TT_BOT_KEY: ${{ secrets.TT_BOT_KEY }}
        run: |
          cd tools/codecard
          if [ "${{ inputs.dry }}" = "true" ]; then python3 azrun.py --dry; else python3 azrun.py; fi
